[package]
name = "gpui_zgui"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "Experimental gpui platform + renderer backend built on winit and zgui"

[lints]
workspace = true

[lib]
path = "src/gpui_zgui.rs"

[features]
default = []
# Route gpui `Path` primitives through zgui's vector passes (vello compute rasteriser)
# instead of the CPU atlas-mask fallback. See milestone M5.
paths-vello = ["dep:zgui-render-vector-vello"]

[dependencies]
anyhow.workspace = true
collections.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_wgpu = { workspace = true, features = ["font-kit"] }
log.workspace = true
parking_lot.workspace = true
pollster.workspace = true
profiling.workspace = true
raw-window-handle.workspace = true
smallvec.workspace = true
util.workspace = true
uuid.workspace = true

# Windowing and input. winit 0.30 is already in zgui's dependency graph, so this adds no
# new version constraint.
winit = "0.30.13"

# The zgui subgraph. None of these reach zgui's DOM, style, layout, text or view layers,
# and none pull the vendored taffy.
zgui-atlas = { path = "../../../zgui/crates/zgui-atlas" }
zgui-bits = { path = "../../../zgui/crates/zgui-bits" }
zgui-color = { path = "../../../zgui/crates/zgui-color" }
zgui-geom = { path = "../../../zgui/crates/zgui-geom" }
zgui-render = { path = "../../../zgui/crates/zgui-render" }
zgui-render-wgpu = { path = "../../../zgui/crates/zgui-render-wgpu" }
zgui-scene = { path = "../../../zgui/crates/zgui-scene" }
zgui-render-vector-vello = { path = "../../../zgui/crates/zgui-render-vector-vello", optional = true }

[dev-dependencies]
env_logger = "0.11"
smallvec.workspace = true
